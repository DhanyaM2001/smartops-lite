# SmartOps-Lite — Continuous Integration
#
# Runs on every push + PR against main. Three parallel jobs mirror the three
# quality gates a developer runs locally:
#
#     make lint       (job: lint)
#     make validate   (job: validate)
#     make test       (job: test)
#
# All three scripts skip missing tools gracefully (see docs/REFERENCE.md §3.5-3.7),
# so we only install what each job actually needs — keeps job runtime under
# ~4 minutes on ubuntu-latest.
#
# Design decisions:
#   - Parallel jobs (not sequential) — faster feedback + isolates failures.
#   - No AWS credentials — every check must run without touching real AWS.
#     (Deployment lives in Module 8.1 with OIDC-based auth.)
#   - Pip + poetry caching — cuts cold-start from ~2min to <30s on warm runs.
#   - Concurrency group — a new push cancels the in-flight run on the same ref.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # manual trigger from GitHub UI

# Cancel in-flight runs on the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job starts with least privilege. Elevate per-job if needed.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  TERRAFORM_VERSION: "1.7.5"
  HELM_VERSION: "v3.14.0"
  POETRY_VERSION: "1.8.3"

jobs:
  # -------------------------------------------------------------------- lint
  lint:
    name: Lint (ruff / mypy / hadolint / tf fmt / yaml / shell)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python linters (ruff + mypy)
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.5.7" "mypy==1.11.1"

      - name: Set up Terraform ${{ env.TERRAFORM_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0

      - name: tflint plugin init (fetches AWS ruleset from .tflint.hcl)
        run: tflint --init

      - name: Install hadolint
        run: |
          curl -fsSL -o hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x hadolint
          sudo mv hadolint /usr/local/bin/hadolint
          hadolint --version

      - name: Install yamllint + shellcheck (from apt)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends yamllint shellcheck

      - name: Run make lint
        run: make lint

  # ---------------------------------------------------------------- validate
  validate:
    name: Validate (terraform validate + helm lint)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform ${{ env.TERRAFORM_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Run make validate
        run: make validate

  # -------------------------------------------------------------------- test
  test:
    name: Test (pytest across every package)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Poetry ${{ env.POETRY_VERSION }}
        run: |
          pipx install "poetry==${{ env.POETRY_VERSION }}"
          poetry --version

      - name: Cache Poetry virtualenvs
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('**/pyproject.toml', '**/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      # `make test` requires each package's dev deps to be installed. We do
      # this explicitly here rather than teaching the script to install so
      # that "test" and "install" stay separate concerns.
      - name: Install per-package dev dependencies
        run: |
          set -e
          for pkg in apps/crashy-app controller lambdas/rca-generator lambdas/remediator lambdas/mttr-aggregator; do
            if [ -f "$pkg/pyproject.toml" ]; then
              echo "==> $pkg"
              (cd "$pkg" && poetry install --no-interaction --with dev --no-root)
            fi
          done

      - name: Run tests
        # Not `make test`: the Makefile exports AWS_PROFILE=smartops, which
        # only exists on the dev machine. The tests use fake credentials.
        run: bash scripts/test.sh
