[tool.poetry]
name = "remediator"
version = "0.1.0"
description = "SmartOps-Lite remediator Lambda — Slack interaction receiver (Ack button + future kubectl patch trigger)."
authors = ["SmartOps-Lite"]
readme = "README.md"
packages = [{ include = "remediator", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
# boto3 is pre-bundled in the AWS Lambda Python runtime — declared here
# only so local + CI unit tests can import it. It is EXCLUDED from the
# deployment zip via the Terraform module's excludes list.
boto3 = { version = ">=1.34,<2", optional = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"
moto = { extras = ["dynamodb", "ssm", "events"], version = "^5.0" }
boto3 = ">=1.34,<2"
ruff = "^0.5"
mypy = ">=1.10,<3.0"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
# Relaxed for CI reality: boto3 + moto don't ship official type stubs, and
# Lambda handler `context: Any = None` doesn't need typing. Still catches
# untyped-body bugs via check_untyped_defs.
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
files = ["src"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
