[tool.poetry]
name = "mttr-aggregator"
version = "0.1.0"
description = "SmartOps-Lite Module 9.0 — scans the incidents DDB table and publishes MTTR/incident-count/ack-rate metrics to CloudWatch."
authors = ["Dhanya M"]
readme = "README.md"
packages = [{include = "mttr_aggregator", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
# boto3 is Lambda-runtime-bundled; only declared here as an optional runtime
# so `poetry install` gets it locally for tests + dev. The deployed Lambda zip
# stays boto3-free — the runtime brings its own.
boto3 = { version = ">=1.34,<2", optional = true }

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"
pytest-cov = "^5.0"
moto = { extras = ["dynamodb", "cloudwatch"], version = "^5.0" }
boto3 = ">=1.34,<2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
# Relaxed for CI reality: boto3 + moto don't ship official type stubs.
# Still catches untyped-body bugs via check_untyped_defs.
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
files = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "SIM", "PL"]
ignore = ["PLR0913", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "PLR2004"]
