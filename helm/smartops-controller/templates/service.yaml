apiVersion: v1
kind: Service
metadata:
  name: {{ include "smartops-controller.fullname" . }}
  labels: {{- include "smartops-controller.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: health
  selector: {{- include "smartops-controller.selectorLabels" . | nindent 4 }}
