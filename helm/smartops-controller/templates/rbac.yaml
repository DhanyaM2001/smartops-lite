{{- if .Values.rbac.create -}}
# ClusterRole granting the controller cluster-wide read on pods, events, nodes.
# CLUSTER scope is intentional: the controller decides which namespaces to watch
# at RUNTIME (via WATCH_NAMESPACES/EXCLUDE_NAMESPACES env vars). Cluster-scoped
# RBAC keeps the Helm chart namespace-agnostic and mirrors what a mature
# operator would do.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "smartops-controller.fullname" . }}
  labels: {{- include "smartops-controller.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "smartops-controller.fullname" . }}
  labels: {{- include "smartops-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "smartops-controller.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "smartops-controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
