[tool.poetry]
name = "smartops-controller"
version = "0.1.0"
description = "In-cluster K8s controller that watches Pod events and publishes incidents to AWS EventBridge."
authors = ["Dhanya M"]
license = "MIT"
readme = "README.md"
packages = [{ include = "smartops_controller", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
kubernetes = "^31.0.0"
boto3 = "^1.35.0"
python-json-logger = "^2.0.7"
fastapi = ">=0.115,<0.162"
uvicorn = { extras = ["standard"], version = ">=0.32,<0.55" }

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
moto = { extras = ["events"], version = "^5.0.0" }
ruff = ">=0.6,<0.18"
mypy = "^1.11.0"

[tool.poetry.scripts]
smartops-controller = "smartops_controller.__main__:main"

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
# Relaxed for CI reality: kubernetes + boto3 + moto don't ship official
# type stubs, and FastAPI decorators mask function signatures. Still
# catches untyped-body bugs via check_untyped_defs.
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --strict-markers"
asyncio_mode = "auto"
