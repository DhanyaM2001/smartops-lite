[tool.poetry]
name = "crashy-app"
version = "0.1.0"
description = "Deliberately-failing FastAPI microservice used by SmartOps-Lite to test the K8s incident-triage pipeline."
authors = ["Dhanya M"]
license = "MIT"
readme = "README.md"
packages = [{ include = "crashy", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic = "^2.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.0"        # FastAPI TestClient dependency
ruff = "^0.6.0"
mypy = "^1.11.0"

[tool.poetry.scripts]
crashy = "crashy.__main__:main"

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"

# ---- Linters -------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]      # line-length handled by formatter

[tool.mypy]
python_version = "3.12"
# Relaxed for CI reality: FastAPI decorators mask function signatures.
# Still catches untyped-body bugs via check_untyped_defs.
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --strict-markers"
asyncio_mode = "auto"